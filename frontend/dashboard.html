<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Student Collaboration Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="dashboard.html" class="logo">Student Collaboration Hub</a>
  <div class="nav-links">
    <a href="dashboard.html" class="nav-item active">Dashboard</a>
    <a href="profile.html" class="nav-item">My Profile</a>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>

<div class="grid-container container">
  <!-- Left Column -->
  <div style="display: flex; flex-direction: column; gap: 24px;">
    
    <!-- Post Project Board -->
    <div class="panel">
      <h2>📌 Post a Project Idea</h2>
      <label>Project Title</label>
      <input type="text" id="projTitle" placeholder="e.g., AI Study Planner App">
      
      <label>Detailed Description</label>
      <textarea id="projDesc" rows="3" placeholder="Briefly describe what your project is about..."></textarea>
      
      <label>Skills Needed (comma separated)</label>
      <input type="text" id="projSkills" placeholder="e.g., React, Node, UI/UX">
      
      <label>Developer Slots Needed</label>
      <input type="number" id="projSlots" placeholder="e.g., 2" min="1">
      
      <button class="action" onclick="createNewProject()">Post Idea Notice</button>
    </div>

    <!-- Skill Search Directory -->
    <div class="panel">
      <h2>🔍 Candidate Skill Search</h2>
      <input type="text" id="skillSearchInput" placeholder="Type a skill (e.g. Python, Design)" onkeyup="searchStudents()">
      <div id="studentSearchResults" style="max-height: 220px; overflow-y: auto;">
        <p style="color: var(--text-muted); font-size: 14px;">Type a skill above to query candidates...</p>
      </div>
    </div>

  </div>

  <!-- Right Column -->
  <div>
    <div class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--bg); padding-bottom: 10px; margin-bottom: 16px;">
        <h2 style="border: none; margin: 0; padding: 0;">👥 Open Collaboration Notices</h2>
      </div>

      <!-- PROJECT LIVE FILTER -->
      <input type="text" id="projectFilterInput" placeholder="🔎 Search projects by title, description, or skills..." onkeyup="renderDashboardFeeds()" style="margin-bottom: 20px;">

      <div id="masterProjectFeed"></div>
    </div>
    
    <div class="panel" style="margin-top: 24px;">
      <h2>📨 Track Sent Requests</h2>
      <div id="mySentRequestsFeed"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => { initDashboard(); });
</script>
</body>
</html>
