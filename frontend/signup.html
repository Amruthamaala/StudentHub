<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Student Hub</title>
  <style>
    :root {
      --primary: #463cd5;
      --primary-hover: #362cb5;
      --bg: #ebedf2;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 0;
    }
    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 40px;
      border-radius: 12px;
      border: 1px solid var(--border); 
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }
    h1 { color: var(--primary); margin: 0 0 6px 0; font-size: 30px; text-align: center; font-weight: 700; }
    .tagline { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 24px; }
    
    .input-group { text-align: left; margin-bottom: 14px; }
    label { display: block; color: var(--text-main); font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; box-sizing: border-box; font-size: 14px;
    }
    button.submit-btn {
      width: 100%; padding: 12px; background-color: var(--primary); color: #ffffff;
      border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px;
    }
    button.submit-btn:hover { background-color: var(--primary-hover); }
    
    .auth-footer { margin-top: 20px; font-size: 14px; color: var(--text-muted); text-align: center; }
    .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="auth-card">
  <h1>Create Account</h1>
  <div class="tagline">Join the Student Collaboration Network</div>

  <form onsubmit="event.preventDefault(); register();">
    <div class="input-group">
      <label for="regName">Full Name *</label>
      <input type="text" id="regName" placeholder="e.g. Sarah Jenkins" required>
    </div>
    
    <div class="input-group">
      <label for="regEmail">Email Address *</label>
      <input type="email" id="regEmail" placeholder="e.g. sarah@gmail.com" required>
    </div>
    
    <div class="input-group">
      <label for="regPassword">Password *</label>
      <input type="password" id="regPassword" placeholder="Create a password" required>
    </div>
    
    <div class="input-group">
      <label for="regCollege">College / University</label>
      <input type="text" id="regCollege" placeholder="e.g. ABC Institute of Tech">
    </div>
    
    <div class="input-group">
      <label for="regBranch">Branch / Department</label>
      <input type="text" id="regBranch" placeholder="e.g. Computer Science">
    </div>
    
    <div class="input-group">
      <label for="regSkills">Skills (comma separated)</label>
      <input type="text" id="regSkills" placeholder="e.g. HTML, Python, Design">
    </div>
    
    <button class="submit-btn" type="submit">Sign Up</button>
  </form>

  <div class="auth-footer">
    Already have an account? <a href="index.html">Login</a>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
