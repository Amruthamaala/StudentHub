<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Student Hub</title>
  <style>
    :root {
      --primary: #463cd5;
      --primary-hover: #362cb5;
      --bg: #ebedf2;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 40px;
      border-radius: 12px;
      border: 1px solid var(--border); 
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
      text-align: center;
    }
    h1 { color: var(--primary); margin: 0 0 6px 0; font-size: 32px; font-weight: 700; }
    .tagline { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
    
    .input-group { text-align: left; margin-bottom: 18px; }
    label { display: block; color: var(--text-main); font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border);
      border-radius: 8px; box-sizing: border-box; font-size: 14px;
    }
    button.submit-btn {
      width: 100%; padding: 12px; background-color: var(--primary); color: #ffffff;
      border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 6px;
    }
    button.submit-btn:hover { background-color: var(--primary-hover); }
    
    .auth-footer { margin-top: 22px; font-size: 14px; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    
    .hint-box { margin-top: 20px; font-size: 12px; color: var(--text-muted); border-top: 1px dashed #e2e8f0; padding-top: 12px; }
  </style>
</head>
<body>

<div class="auth-card">
  <h1>Student Hub</h1>
  <div class="tagline">Connect • Create • Collaborate</div>

  <form onsubmit="event.preventDefault(); login();">
    <div class="input-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="name@university.com" required>
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" required>
    </div>
    <button class="submit-btn" type="submit">Login</button>
  </form>

  <div class="auth-footer">
    Don't have an account? <a href="signup.html">Sign up</a>
  </div>

  
</div>

<script src="app.js"></script>
</body>
</html>
