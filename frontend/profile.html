<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Student Collaboration Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="dashboard.html" class="logo">Student Hub</a>
  <div class="nav-links">
    <a href="dashboard.html" class="nav-item">Dashboard</a>
    <a href="profile.html" class="nav-item active">My Profile</a>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>

<div class="container" style="max-width: 650px;">
  <div class="panel">
    <h2>👤 Edit Student Profile</h2>
    
    <label>College / University</label>
    <input type="text" id="myCollegeInput" placeholder="e.g. Stanford / ABC Institute">
    
    <label>Branch / Department</label>
    <input type="text" id="myBranchInput" placeholder="e.g. Computer Science, Electrical, Design">
    
    <label>My Skills (comma separated)</label>
    <input type="text" id="mySkillsInput" placeholder="e.g. HTML, Python, Figma, React">
    
    <label>Short Bio / Portfolio Tagline</label>
    <textarea id="myBioInput" rows="3" placeholder="Tell potential team members about yourself..."></textarea>
    
    <button class="action" onclick="updateProfile()">Save Profile Details</button>
  </div>
</div>

<script src="app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => { loadProfilePage(); });
</script>
</body>
</html>
